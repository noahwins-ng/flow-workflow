name: opencode-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.opencode/**'
      - 'skills/**'
      - 'profile.template.yaml'
      - 'adapters/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Wire plugin (local checkout)
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "plugin": ["$GITHUB_WORKSPACE/.opencode/plugin/flow.ts"],
            "mcp": { "linear": { "type": "remote", "url": "https://mcp.linear.app/mcp" } }
          }
          JSON
          # CI can't do OAuth — fall back to adapter key if secret is set
          if [ -n "${{ secrets.LINEAR_API_KEY }}" ]; then
            echo "LINEAR_API_KEY present — adapter fallback will be used"
          else
            echo "::warning::No LINEAR_API_KEY secret — tracker steps will be skipped"
          fi
      - name: Headless smokes (no LLM needed)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          # 1) skills + commands visible via server API (no LLM)
          opencode serve --port 49494 > /tmp/ocserve.log 2>&1 &
          for i in 1 2 3 4 5; do curl -sf http://127.0.0.1:49494/command >/tmp/cmd.json && break; sleep 2; done
          python3 -c "import json; cmds=[c['name'] for c in json.load(open('/tmp/cmd.json'))]; assert 'flow-ship-issue' in cmds, cmds; assert 'flow-doctor' in cmds; print(f'{len(cmds)} commands, flow present')"
          curl -sf http://127.0.0.1:49494/mcp | tee /tmp/mcp.json
          # mcp.linear is configured — expect needs_auth (CI can't OAuth) or connected
          python3 -c "import json; d=json.load(open('/tmp/mcp.json')); assert 'linear' in d, d; print('mcp:', d['linear'])"
          pkill -f "opencode serve" || true

          # 2) local-only static checks (no LLM)
          ./scripts/check.sh

          # 3) tracker smoke via adapter if key present (native MCP needs OAuth, not available in CI)
          if [ -n "$LINEAR_API_KEY" ]; then
            ./adapters/linear.sh issue get QNT-314 2>&1 | head -5
          else
            echo "::warning::No LINEAR_API_KEY — tracker adapter smoke skipped (native MCP needs OAuth)"
          fi
